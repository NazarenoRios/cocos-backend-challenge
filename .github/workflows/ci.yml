name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test

  docker:
    name: Imagen Docker
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cocos-backend-challenge .
      - name: Smoke test del contenedor
        run: |
          docker network create smoke
          docker run -d --name db --network smoke \
            -e POSTGRES_USER=cocos -e POSTGRES_PASSWORD=cocos -e POSTGRES_DB=cocos \
            -v "$PWD/db/database.sql:/docker-entrypoint-initdb.d/database.sql:ro" \
            postgres:18-alpine
          timeout 60 sh -c 'until docker exec db psql -h 127.0.0.1 -U cocos -d cocos -c "SELECT 1 FROM orders LIMIT 1" >/dev/null 2>&1; do sleep 1; done'
          docker run -d --name api --network smoke -p 3000:3000 \
            -e DATABASE_URL=postgresql://cocos:cocos@db:5432/cocos \
            cocos-backend-challenge
          timeout 60 sh -c 'until curl -fs http://localhost:3000/health >/dev/null; do sleep 2; done'
          curl -fsS http://localhost:3000/users/1/portfolio | grep -q '"totalValue":"889756.00"'
      - name: Logs del contenedor
        if: failure()
        run: docker logs api || true
